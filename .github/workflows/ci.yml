name: validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: python3 scripts/validate-plugin.py
      - run: bash tests/test-guardrail.sh
      - run: bash tests/test-lint.sh
      - run: bash tests/test-resolve-data-root.sh
      - run: bash tests/test-sidecar-memory-context.sh
      - run: bash tests/test-memory-graph.sh
      - run: bash tests/test-capture-cadence.sh
      - run: bash tests/test-claude-md-upsert.sh
      - run: bash tests/test-portable-templates.sh
      - run: bash tests/test-stamp-portable-layer.sh
      - run: bash tests/test-guardrails-upsert.sh
